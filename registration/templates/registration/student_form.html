<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    {% if student %}
        <h1>Edit Student</h1>
    {% else %}
        <h1>Register Student</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>
    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back to Student List
    </a>

</body>
</html>
